<text x="1001.17" y="228" font-size="12" fill="#526170">Recorded after workout</text>
<text x="1001.17" y="250" font-size="12" font-weight="bold" fill="#226b3c">High rating</text>
</g>
<text x="85" y="286" font-size="13" fill="#526170">History colors: green = within reference; yellow = outside; red = large deviation. Feeling: 4–5 green, 3 yellow, 1–2 red.</text>
<text x="85" y="307" font-size="13" fill="#526170">Calculated reference: central 80% of the preceding 60 days; selected night excluded. Not the Suunto normal range.</text>
