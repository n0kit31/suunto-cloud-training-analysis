<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="873" viewBox="0 0 1200 873" role="img" aria-labelledby="title desc">
<title id="title">Synthetic sleep and recovery chart</title>
<desc id="desc">Example sleep stages, nightly HRV and maximum SpO₂ by wake date. The night after the workout appears separately.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<g transform="translate(0 -85)">
