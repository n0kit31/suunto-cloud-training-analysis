<text x="277.83" y="250" font-size="12" font-weight="bold" fill="#226b3c">Within reference</text>
</g>
<g data-tile="2" data-status="reference">
<title>60-day HRV reference: Reference only</title>
<rect x="446.67" y="151" width="170.83" height="112" rx="8" fill="#f3f6f8" stroke="#dce2e7"/>
