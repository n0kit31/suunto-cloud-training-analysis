name: suunto-cloud

x-auth-config: &auth-config
  type: bind
  source: ${SUUNTO_WEB_AUTH_DIR:-.}
  target: /auth-config
  read_only: true
  bind:
    create_host_path: false

x-auth-private: &auth-private
  type: bind
  source: ${SUUNTO_WEB_AUTH_DIR:-.}/.local
  target: /auth/.local
  bind:
    create_host_path: false

services:
  suunto:
    profiles: [cli]
    image: suunto-cloud-training-analysis:local
    build:
      context: .
      target: app
    user: "${SUUNTO_UID:-1000}:${SUUNTO_GID:-1000}"
    init: true
    stdin_open: true
    tty: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      SUUNTO_CONFIG_PATH: /auth-config/config.json
      SUUNTO_AUTH_DIR: /auth/.local
      SUUNTO_OAUTH_BIND_HOST: 0.0.0.0
      SUUNTO_TIMEZONE: "${SUUNTO_TIMEZONE:-}"
      TZ: "${TZ:-}"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - *auth-config
      - *auth-private
      - type: bind
        source: ./.local
        target: /app/suunto-cloud/.local
        bind:
          create_host_path: false
      - type: bind
        source: ../reports
        target: /app/reports
        bind:
          create_host_path: false
      - type: bind
        source: ../visualizations
        target: /app/visualizations
        bind:
          create_host_path: false

  web-data-init:
    image: node:24-bookworm-slim
    user: "0:0"
    entrypoint: [sh, -ec]
    command:
      - |
        chmod 0700 /data
        chown "$$1:$$2" /data
      - init
      - "${SUUNTO_UID:-1000}"
      - "${SUUNTO_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - web-data:/data

  web:
    image: suunto-training-web:local
    build:
      context: .
      target: web
    user: "${SUUNTO_UID:-1000}:${SUUNTO_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      web-data-init:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SUUNTO_WEB_DATA: /data
    ports:
      - "127.0.0.1:${SUUNTO_WEB_PORT:-3000}:3000"
    volumes:
      - web-data:/data

  worker:
    image: suunto-training-worker:local
    build:
      context: .
      target: worker
    user: "${SUUNTO_UID:-1000}:${SUUNTO_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      web-data-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      SUUNTO_WEB_DATA: /data
      SUUNTO_CONFIG_PATH: /auth-config/config.json
      SUUNTO_PRIVATE_DIR: /auth/.local
      SUUNTO_TIMEZONE: "${SUUNTO_TIMEZONE:-}"
      TZ: "${TZ:-}"
    volumes:
      - web-data:/data
      - *auth-config
      - *auth-private

volumes:
  web-data:
