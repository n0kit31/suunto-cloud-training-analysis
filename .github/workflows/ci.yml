name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Node.js tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install FIT decoder dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run offline tests
        run: npm test
      - name: Check the test count badge
        run: node scripts/update-test-badge.mjs --check

  docker:
    name: Docker image checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and verify the container images
        run: sh scripts/docker/test-image.sh
      - name: Verify the web app and CLI with a synthetic FIT
        run: npm run test:compose
